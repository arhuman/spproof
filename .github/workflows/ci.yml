name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. The release workflow gets write.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor = the go.mod minimum (keep in sync); "stable" = latest release,
        # which is also what release.yml ships with.
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Build
        run: make build
      - name: Test (race, no cache)
        run: make fulltest
      - name: Benchmarks (smoke, 1x)
        run: go test -run='^$' -bench=. -benchmem -benchtime=1x ./...

      # The gates carry a !race build tag, so the race-enabled run above skips
      # them entirely. They need their own uninstrumented run: under -race this
      # workload costs about 27x, which would measure the detector rather than
      # the engine.
      - name: Performance gates
        run: go test -count=1 ./internal/engine -run 'TestThroughputGate|TestHookPathGate' -v

  lint:
    name: lint + vuln + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not `stable`: the pinned golangci-lint's staticcheck must understand
          # this toolchain's stdlib; a newer Go panics it. go.mod names both the
          # floor and the toolchain, and setup-go honours the toolchain line.
          go-version-file: go.mod
      # Pre-install the pinned tools so `make audit` reuses them instead of
      # bootstrapping via `make tools`.
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # `make audit` = coverage gate + go vet + golangci-lint + govulncheck.
      # One code path, local and CI.
      - name: Audit
        run: make audit

  dogfood:
    name: policy on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # spproof enforcing its own policy on itself. The first consumer of the
      # tool is the repo that builds it.
      - name: Check
        run: |
          go build -o /tmp/spproof ./cmd/spproof
          /tmp/spproof check --policy .spproof.yml .

      # The unit tests assert the $schema string; only a real validator proves
      # the document satisfies it. Kept in CI rather than in a Go test so the
      # module stays on its single dependency and the suite stays offline.
      #
      # Two shapes, because they differ structurally: a plain violation, and a
      # ratchet-tolerated one that renders as a suppressed result. A schema pass
      # on the first says nothing about the second.
      - name: Validate SARIF against the OASIS schema
        run: |
          set -euo pipefail
          curl -sfL --retry 3 -o /tmp/sarif-schema.json \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json

          mkdir -p /tmp/sarif && cd /tmp/sarif
          printf 'a\nTODO x\n' > t.md
          cat > plain.yml <<'YAML'
          version: 1
          rules:
            - id: no-todo
              check: pattern_absent
              files: ["*.md"]
              with:
                pattern: "TODO"
          YAML
          cat > ratchet.yml <<'YAML'
          version: 1
          rules:
            - id: no-todo
              check: pattern_absent
              files: ["*.md"]
              baseline: 5
              with:
                pattern: "TODO"
          YAML

          # A violating run exits 1 and still must emit a valid document, so the
          # exit code is captured rather than allowed to kill the step.
          /tmp/spproof check --policy plain.yml --format sarif t.md > violation.sarif || true
          /tmp/spproof check --policy ratchet.yml --format sarif t.md > tolerated.sarif
          /tmp/spproof check --policy plain.yml --format sarif --stdin --as=clean.md \
            < /dev/null > clean.sarif

          # Guard against validating an empty file: curl or spproof failing
          # would otherwise leave a file the validator happily passes.
          for f in violation.sarif tolerated.sarif clean.sarif; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          grep -q '"suppressions"' tolerated.sarif \
            || { echo "::error::tolerated.sarif carries no suppression"; exit 1; }

          pipx run --spec check-jsonschema==0.35.0 check-jsonschema \
            --schemafile /tmp/sarif-schema.json \
            violation.sarif tolerated.sarif clean.sarif

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?(!)?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha is not Conventional Commits: '$subject'"
              fail=1
            fi
          done
          exit $fail

  codeql:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
