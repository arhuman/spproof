name: Release

on:
  push:
    tags: ["v*"]

# Release needs to create the GitHub Release and upload assets.
permissions:
  contents: write
  id-token: write # cosign keyless signing (OIDC), per .goreleaser.yaml signs:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history + tags to build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Ship binaries built with the latest stable Go for all runtime/stdlib
          # security fixes, independent of the go.mod floor.
          go-version: stable
      # .goreleaser.yaml declares sboms: and signs:, so syft and cosign must be
      # on PATH or the release fails with "executable file not found".
      # Pinned to an exact patch, not @v4: sigstore/cosign-installer publishes no
      # floating major tag, so @v4 fails to resolve and the job dies at "Set up
      # job" before any step runs.
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
