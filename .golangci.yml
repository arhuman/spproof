version: "2"

# Standard project config. Encodes the shared complexity/duplication
# thresholds of the tier ladder (see ../../_shared/README.md) so reviews and
# daily linting measure the same things.
#
# gosec is required by the lint.config check in ../../_shared/references/standard.yml
# ("a golangci-lint v2 config with gosec enabled"). Do not drop it to green a
# build: exclude the specific rule at the specific path, with a reason, the way
# the G304 block below does.
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - nestif
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    dupl:
      threshold: 50
    funlen:
      lines: 80
      statements: -1
    gocognit:
      min-complexity: 16 # flags cognitive complexity > 15
    gocyclo:
      min-complexity: 11 # flags cyclomatic complexity > 10
    nestif:
      min-complexity: 4
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-U1000"
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of .*\\.Close` is not checked"
      # A tool whose job is reading a caller-named path trips G304 on its own
      # purpose. Narrow this to the packages that legitimately do it, or delete
      # it: a blanket G304 exclusion gives up the check everywhere.
      # - linters: [gosec]
      #   text: "G304: Potential file inclusion via variable"
      #   path: internal/(parse|storage)/
      # Fixtures need traversable directories and sometimes deliberately odd
      # modes (G301/G302/G306). None of it ships in the binary.
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gosec
