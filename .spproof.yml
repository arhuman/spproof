version: 1
rules:
  - id: no-em-dash
    check: pattern_absent
    files:
      - "*.md"
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "docs/**/*.md"
    with:
      pattern: "[—–]"
      # The README documents this very rule, so its examples contain the
      # characters the rule forbids. Prose is the subject; code is not.
      skip_code: true
